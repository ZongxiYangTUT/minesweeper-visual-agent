[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minesweeper-visual-agent"
version = "0.3.0"
description = "Screen-only Minesweeper recognition and exact constraint solving for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "mss>=9,<11",
    "pyautogui>=0.9.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
minesweeper-agent = "minesweeper_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
